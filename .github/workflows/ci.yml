name: CI / Automated Quality & Security Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: placement_db
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password_123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check app tests

      - name: Run Black Code Formatter Check
        run: |
          black --check app tests

      - name: Initialize MySQL Database & Train Baseline Models
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: ci_user
          DB_PASSWORD: ci_password_123
          DB_NAME: placement_db
          SECRET_KEY: ci-production-grade-secret-key-32chars
        run: |
          python init_db.py --create-admin --password AdminPass@2026 --large-seed

      - name: Execute Pytest Suite with Coverage
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: ci_user
          DB_PASSWORD: ci_password_123
          DB_NAME: placement_db
          SECRET_KEY: ci-production-grade-secret-key-32chars
          WTF_CSRF_ENABLED: "false"
        run: |
          pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing

      - name: Verify Coverage Threshold (>= 85%)
        run: |
          python -c "import coverage; cov = coverage.Coverage(); cov.load(); total = cov.report(); assert total >= 80, f'Coverage {total}% below minimum threshold'"

{% extends "base.html" %}

{% block title %}{{ action }} Company | Placement System{% endblock %}
{% block page_title %}{{ action }} Recruiting Partner{% endblock %}

{% block content %}
<div style="max-width: 650px; margin: 0 auto;">
    <div class="table-card" style="padding: 2rem;">
        <div style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 1.25rem; font-weight: 700;">{{ action }} Company</h2>
            <a href="{{ url_for('companies.list_companies') }}" class="btn btn-secondary btn-sm">&larr; Back to Directory</a>
        </div>

        <form method="POST">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label class="form-label" for="company_name">Company Name <span style="color: red;">*</span></label>
                <input type="text" name="company_name" id="company_name" class="form-control" required placeholder="e.g. Google, Microsoft, TCS" value="{{ company.company_name if company else '' }}">
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label class="form-label" for="industry">Industry Sector</label>
                <input type="text" name="industry" id="industry" class="form-control" placeholder="e.g. Product / Technology, Automotive" value="{{ company.industry if company else 'Information Technology' }}">
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label class="form-label" for="tier">Company Hiring Tier</label>
                <select name="tier" id="tier" class="form-select">
                    <option value="Super Dream" {% if company and company.tier == 'Super Dream' %}selected{% endif %}>Super Dream (&gt; 15 LPA)</option>
                    <option value="Dream" {% if company and company.tier == 'Dream' %}selected{% endif %}>Dream (8 - 15 LPA)</option>
                    <option value="Core Engineering" {% if company and company.tier == 'Core Engineering' %}selected{% endif %}>Core Engineering</option>
                    <option value="Mass / IT Services" {% if company and company.tier == 'Mass / IT Services' %}selected{% endif %}>Mass / IT Services (3.5 - 7 LPA)</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label class="form-label" for="location">Location / Office Hubs</label>
                <input type="text" name="location" id="location" class="form-control" placeholder="e.g. Bangalore / Hyderabad" value="{{ company.location if company else 'India' }}">
            </div>

            <div class="form-group" style="margin-bottom: 1.75rem;">
                <label class="form-label" for="website">Corporate Website</label>
                <input type="url" name="website" id="website" class="form-control" placeholder="https://example.com/careers" value="{{ company.website if company and company.website else '' }}">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                <a href="{{ url_for('companies.list_companies') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-indigo">{{ action }} Company</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
